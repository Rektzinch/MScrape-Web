name: Security checks

on:
  pull_request:
    branches:
      - agent/redesign-dashboard-produksi
      - security
  push:
    branches:
      - agent/redesign-dashboard-produksi
      - security

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
